<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration </title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <P id="back-link"><a>&#8592; Back</a></P>
        <h2>WELCOME TO EDUVibe !</h2>
        <p>Join our vibrant community of learners and educators at EDUVibe, where knowledge meets opportunity..</p>
    </div>
    <div class="outer">
        <h2>LOG<span>in</span></h2>
        <img src="WE Logo.jpeg" alt="EDUVibe Logo">
     <div class="inner">
        <form action="#" method="post">
            
            <input type="email" name="email" placeholder="Enter Username" size="50"><br>
          <input type="password" name="password" placeholder="Enter Password" size="50" maxlength="10"><br>
            <button type="submit">Log in</button>
            <button type="submit" class="signup">don't have an account? Sign up</button>
        </form>
        <a id="fp" href="#">Forgot Password?</a>
     </div>
    </div>
    <script>
        document.getElementById("back-link").addEventListener("click", function(){
            window.history.back();
        })
    </script>
</body>
</html>
